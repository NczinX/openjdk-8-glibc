name: Build e publicar repositório apt

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CLOUDFLARE_PROJECT_NAME: openjdk-8-glibc

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache de pacotes apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-cache-${{ runner.os }}-patchelf-dpkgdev

      - name: Instalar dependências de build
        run: |
          MISSING=""
          for pkg in patchelf dpkg-dev; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              MISSING="$MISSING $pkg"
            fi
          done
          if [ -n "$MISSING" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y $MISSING
          else
            echo "Dependências já instaladas, pulando."
          fi

      - name: Cache do tarball do Temurin 8
        uses: actions/cache@v4
        with:
          path: cache
          key: temurin8-tarball-${{ runner.os }}
          restore-keys: |
            temurin8-tarball-

      - name: Dar permissão de execução aos scripts
        run: |
          chmod +x build.sh
          chmod +x scripts/make-repo.sh

      - name: Buildar o .deb (openjdk-8-glibc)
        run: bash build.sh
        env:
          CI: "true"

      - name: Publicar o .deb no GitHub Releases (hospedagem)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apt-pool
          name: Pacotes (hospedagem apt)
          files: openjdk-8-glibc_*_aarch64.deb

      - name: Montar o repositório apt (pool + dists)
        run: |
          DEB_FILE=$(ls openjdk-8-glibc_*_aarch64.deb | head -n1)
          echo "Pacote gerado: $DEB_FILE"
          bash scripts/make-repo.sh "$DEB_FILE"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DEB_REDIRECT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/apt-pool

      - name: Copiar install.sh para o repositório publicado
        run: |
          cp install.sh dist-repo/install.sh
          cp install.sh dist-repo/index.html
          cp _headers dist-repo/_headers

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          directory: dist-repo
          branch: main

      - name: Criar GitHub Release com o .deb anexado
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: openjdk-8-glibc_*_aarch64.deb
          generate_release_notes: true
